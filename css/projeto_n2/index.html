<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio Informatica 4</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <div id="container">
        <header>
            <div class="logo-box">
                <img src="assets/images.png" alt="LOGO">
            </div>
            <div class="nome-lab">
                Laboratorio Informática 4
            </div>
        </header>

        <main class="conteudo-principal">
            <h2>monitoramento de computadores</h2>
            
            <div class="grade-computadores">
                <div class="linha-pc">
                    <div class="computador ligado">C1</div>
                    <div class="computador ligado">C2</div>
                    <div class="computador ligado">C3</div>
                    <div class="computador ligado">C4</div>
                    
                    <div class="espaco-meio"></div>
                    
                    <div class="computador desligado">C5</div>
                    <div class="computador desligado">C6</div>
                    <div class="computador desligado">C7</div>
                    <div class="computador desligado">C8</div>
                </div>
                <div class="linha-pc">
                    <div class="computador desligado">C9</div>
                    <div class="computador ligado">C10</div>
                    <div class="computador desligado">C11</div>
                    <div class="computador ligado">C12</div>
                    
                    <div class="espaco-meio"></div>
                    
                    <div class="computador desligado">C13</div>
                    <div class="computador ligado">C14</div>
                    <div class="computador desligado">C15</div>
                    <div class="computador ligado">C16</div>
                </div>

            </div>
        </main>

        <footer>
            <div class="legenda-item">
                <div class="status ligado"></div>
                <span>LIGADO</span>
            </div>
            <div class="legenda-item">
                <div class="status desligado"></div>
                <span>DESLIGADO</span>
            </div>
        </footer>
    </div>

</body>
</html>
