<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>Minha Loja</h2>

        <nav>
            <a href="#principal">Principal</a>
            <a href="#quem-somos">Quem Somos</a>
            <a href="#produtos">Produtos</a>
        </nav>
    </header>

    <section id="principal">

        <h1>Bem-vindo à nossa loja!</h1>

        <p>
            Aqui você encontra frutas deliciosas e muito mais!
        </p>

    </section>

    <section id="quem-somos">

        <h2>Quem Somos</h2>

        <p>
            Somos uma loja que oferece produtos variados para nossos clientes.
        </p>

    </section>

    <section id="produtos">

        <h2>Nossas Frutas</h2>

        <div class="painel">
            <div class="grupo grupo-esquerda">

                <div class="caixa caixa-1 banana">
                    Banana
                </div>

                <div class="caixa caixa-2 maca">
                    Maçã
                </div>

            </div>

            <div class="grupo grupo-direita">

                <div class="caixa caixa-1 laranja">
                    Laranja
                </div>

                <div class="caixa caixa-2 melancia">
                    Melancia
                </div>

            </div>

        </div>

    </section>

</body>

</html>
