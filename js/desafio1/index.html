<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="Style.css">
    <script type="text/javascript" src="js/script.js" defer></script>
    <title>Calculadora de Soma</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Somar Números</legend>

            <label for="iptNum1">Número 1: </label>
            <input type="number" id="iptNum1"><br><br>

            <label for="iptNum2">Número 2: </label>
            <input type="number" id="iptNum2"><br><br>

            <button type="button" onclick="somar()" id="btnSomar">Somar</button>
            <button type="button" onclick="limpar()" id="btnLimpar">Limpar</button><br><br>

            <span>Resultado: <strong id="spnResultado">0</strong></span>
        </fieldset>
    </form>
</body>
