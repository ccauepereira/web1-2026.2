<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Formulário</title>
</head>
<body>

  <h1>Formulário de Cadastro</h1>
  
  <form action="/action_page.php">
    
    <!-- ============================== -->
    <!-- CAIXA 1: DADOS PESSOAIS        -->
    <!-- ============================== -->
    <fieldset>
      <legend>Dados Pessoais</legend>
      
      <label for="fname_pes">Nome:</label>
      <input type="text" id="fname_pes" name="fname_pes"><br><br>
      
      <label for="data_pes">Data:</label>
      <input type="date" id="data_pes" name="data_pes"><br><br>
      
      <label for="end_pes">Endereço:</label> 
      <input type="text" id="end_pes" name="Endereco_pes"><br><br>

      <!-- BAIRRO E CIDADE LADO A LADO -->
      <label for="bairro_pes">Bairro:</label> 
      <input type="text" id="bairro_pes" name="Bairro_pes"> 
      
      <label for="cidade_pes">Cidade:</label>
      <input type="text" id="cidade_pes" name="Cidade_pes"><br><br>
      
      <!-- CEP E ESTADO LADO A LADO -->
      <label for="cep_pes">CEP:</label>
      <input type="text" id="cep_pes" name="cep_pes" size="10"> 
      
      <label for="estado">Estado:</label>
      <select id="estado" name="estado">
        <option value="">Selecione...</option>
        <option value="SP">São Paulo</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="MG">Minas Gerais</option>
        <option value="BA">Bahia</option>
      </select><br><br>

      <label for="cor_pes">Cor Favorita:</label>
      <input type="color" id="cor_pes" name="cor_pes"><br><br>
      
      <label for="satisfacao">Nível de Satisfação (0 a 100):</label><br>
      <input type="range" id="satisfacao" name="satisfacao" min="0" max="100">
    </fieldset>
    
    <br> <!-- Espaço entre as duas caixas -->

    <!-- ============================== -->
    <!-- CAIXA 2: DADOS PROFISSIONAIS   -->
    <!-- ============================== -->
    <fieldset>
      <legend>Dados Profissionais</legend>

      <h3> natureza do cargo</h3>
      <input type="radio" id="profissoes_gerencia" name="natureza do cargo " value="Gerencia">
      <label for="profissoes_gerencia">Gerencia</label>
      <input type="radio" id="profissoes_financeiro" name="natureza do cargp" value="Financeiro">
      <label for="profissoes_financeiro">Financeiro</label>
      <input type="radio" id="profissoes_recepcao" name="natureza do cargo" value="Recepção">
      <label for="profissoes_recepcao">Recepção</label>
      <input type="radio" id="profissoes_administrativo" name="natureza do cargo" value="Administrativo">
      <label for="profissoes_recepcao">Administrativo</label>
      <input type="radio" id="profissoes_juridico" name="natureza do cargo" value="Juridico">
      <label for="profissoes_juridico">Juridico</label><br><br>

      <h3> Area de interesse</h3>
      <input type="checkbox" id="interesse" name="interesse1" value="Computação">
      <label for="interesse"> Computação </label>
      <input type="checkbox" id="interesse2" name="interesse2" value="Quimica">
      <label for="interesse2"> Quimica </label>
      <input type="checkbox" id="interesse3" name="interesse3" value="Meio-Ambiente">
      <label for="interesse3"> Meio Ambiente</label>
      <input type="checkbox" id="interesse4" name="interesse4" value="Engenharia">
      <label for="interesse4"> Engenharia </label>
      <input type="checkbox" id="interesse5" name="interesse5" value="Matematica">
      <label for="interesse"> Matematica </label>
    <br><br>

    <label for="mini_curriculo">Mini Currículo:</label><br>
      <!-- Criando uma caixa com 5 linhas de altura e 40 caracteres de largura -->
    <textarea id="mini_curriculo" name="mini_curriculo" rows="5" cols="40"></textarea><br><br>

    <!-- Botões -->
    <input type="submit" value="Enviar"> 
    <input type="reset" value="Limpar Tudo">
    
  </form>

</body>
</html>
